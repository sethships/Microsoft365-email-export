name: lint

# DISABLED — manual-only runs (workflow_dispatch) until we curate a
# `-ExcludeRule` / SuppressedRules list. The first PR-triggered run
# produced 45 PSAvoidUsingWriteHost warnings (all from the deliberate
# colored UI output) and 1 PSAvoidUsingConvertToSecureStringWithPlainText
# "Error" — which is in fact the only legal way to pass an access token
# to `Connect-MgGraph` (the SDK's -AccessToken parameter requires a
# SecureString). The signal is buried under known false positives.
#
# To re-enable automatic runs once the exclusion list is in place, restore
# the `push:` and `pull_request:` triggers below. The trigger block looked
# like this when active:
#
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:

# (Concurrency block intentionally removed while the workflow is manual-only.
# Re-add it together with the push/pull_request triggers when re-enabling:
#
#   concurrency:
#     group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# )

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    # Run on both Windows and Linux to catch platform-specific issues.
    # The script targets Windows but pwsh is cross-platform; cross-OS lint
    # is cheap insurance and catches `[System.IO.Path]` quirks etc.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Pinned to a full commit SHA (not a floating tag) for supply-chain
      # hygiene. Dependabot (.github/dependabot.yml) will open PRs to bump
      # this when upstream cuts new releases.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Cache the installed PSScriptAnalyzer module across runs. PSGallery
      # installs cost ~30s per OS per run; caching them is a clean win.
      # The cache key includes the OS and a hand-rolled version so we can
      # bump it when we want a fresh module.
      - name: Cache PSScriptAnalyzer
        id: cache-pssa
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/powershell/Modules/PSScriptAnalyzer
            ~/Documents/PowerShell/Modules/PSScriptAnalyzer
          key: pssa-${{ runner.os }}-v1

      - name: Install PSScriptAnalyzer
        if: steps.cache-pssa.outputs.cache-hit != 'true'
        run: |
          # `-Force` already bypasses the PSGallery trust prompt, so we do
          # not need (and should not use) the deprecated
          # `Set-PSRepository -InstallationPolicy Trusted` from PowerShellGet v2.
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber -Repository PSGallery

      - name: Show PSScriptAnalyzer version
        run: |
          Import-Module PSScriptAnalyzer
          (Get-Module PSScriptAnalyzer).Version | Write-Host

      - name: Parse-check all PowerShell files
        run: |
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psm1,*.psd1
          $hadErrors = $false
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errs)
            # GitHub annotation `file=` paths must be workspace-relative,
            # not absolute, or the annotation silently fails to attach to
            # the diff.
            $relPath = [System.IO.Path]::GetRelativePath($PWD.Path, $f.FullName).Replace('\','/')
            if ($errs) {
              $hadErrors = $true
              Write-Host "::error file=$relPath::Parse errors:"
              $errs | ForEach-Object {
                "  $($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber)  $($_.Message)" | Write-Host
              }
            } else {
              "OK: $relPath" | Write-Host
            }
          }
          if ($hadErrors) { exit 1 }

      - name: Run PSScriptAnalyzer
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity @('Error','Warning','Information')
          if (-not $results) {
            Write-Host "No PSScriptAnalyzer findings."
            return
          }

          # Print a human-readable table so PR reviewers can scan results in the log.
          $results | Sort-Object Severity, ScriptName, Line |
            Format-Table -AutoSize Severity, ScriptName, Line, RuleName, Message |
            Out-String -Width 200 | Write-Host

          # Emit GitHub annotations so findings appear inline on the diff.
          # `file=` must be workspace-relative — `ScriptName` is just the
          # leaf filename, so we resolve `ScriptPath` (absolute) against
          # the workspace root.
          foreach ($r in $results) {
            $level = switch ($r.Severity) {
              'Error'       { 'error' }
              'Warning'     { 'warning' }
              default       { 'notice' }
            }
            $path = if ($r.ScriptPath) {
              [System.IO.Path]::GetRelativePath($PWD.Path, $r.ScriptPath).Replace('\','/')
            } else {
              $r.ScriptName
            }
            $msg = "$($r.RuleName): $($r.Message)" -replace "`r?`n", ' '
            "::$level file=$path,line=$($r.Line),col=$($r.Column)::$msg" | Write-Host
          }

          # Gate: fail on any `Error`-severity PSScriptAnalyzer finding.
          # NOTE: in PSSA, `Error` is a rule-severity classification (e.g.
          # PSAvoidUsingPlainTextForPassword) — NOT a parse failure. Raw
          # parse failures are caught by the separate `Parser::ParseFile`
          # step above. Warnings are surfaced as annotations but do not
          # break the build until we've deliberately curated a
          # SuppressedRules list.
          $errorCount = ($results | Where-Object Severity -eq 'Error' | Measure-Object).Count
          $warnCount  = ($results | Where-Object Severity -eq 'Warning' | Measure-Object).Count
          Write-Host "Findings: $errorCount error, $warnCount warning, $($results.Count - $errorCount - $warnCount) information"
          if ($errorCount -gt 0) {
            Write-Error "$errorCount PSScriptAnalyzer error(s) found."
            exit 1
          }
